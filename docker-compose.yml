services:
  postgres:
    restart: always
    image: "postgres:16"
    ports:
      - "5432"
    environment:
      POSTGRES_DB: thingsboard
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data

  thingsboard-ce:
    restart: always
    image: "thingsboard/tb-node:4.3.1.1"
    ports:
      - "9090:9090"
      - "7070:7070"
      - "1883:1883"
      - "8883:8883"
      - "5683-5688:5683-5688/udp"
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "10"
    environment:
      TB_SERVICE_ID: tb-ce-node
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/thingsboard
      HTTP_BIND_PORT: 9090
    depends_on:
      - postgres

  tb-web-ui:
    restart: always
    image: "thingsboard/tb-web-ui:latest"
    ports:
      - "8080"
    environment:
      HTTP_BIND_PORT: 8080
      TB_ENABLE_PROXY: "false"
    depends_on:
      - thingsboard-ce

  nginx:
    restart: always
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - thingsboard-ce
      - tb-web-ui

volumes:
  postgres-data:
    name: tb-postgres-data
    driver: local